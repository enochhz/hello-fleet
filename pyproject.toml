[tool.poetry]
name = "hello-fleet"
version = "0.1.0"
description = "Pilot member for platform-hosted deployment (M5)"
authors = ["Turing Planet <walkerhaozheng@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
mcp = "^1.2"
fastapi = "^0.115"     # REST surface at /api (served alongside /mcp when deployed)
uvicorn = "^0.30"      # ASGI server for HTTP/deploy mode

[tool.poetry.group.dev.dependencies]
pytest = "^8"
ruff = "^0.5"
bandit = "^1.7"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
